# Fixed architecture: privtab/model.py. Only active training settings are configurable.
model:
  normalize_perturbed_output: true
training:
  epochs: 1000
  learning_rate: 1.0e-05
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-08
  weight_decay: 0.001
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  encoder_freeze_epoch: 950
  label_smoothing: 0.1
  seed: 1
  validation_interval: 10
  checkpoint_interval: 20
  scheduler:
    type: constant
  initial_weights: models/stage1/weights.pt
data:
  dim: 120
  min_nc: 1024
  max_nc: 8192
  min_nt: 100
  max_nt: 2048
  max_classes: 10
  dummy_fill_value: 0.0
  min_mu: 0.16
  max_mu: 64.0
  train_tasks: 32768
  validation_tasks: 8192
  batch_size: 32
